name: Build & Test (RHEL/CentOS)
description: "Composite action to build and test the ODBC connector on RHEL/CentOS"

runs:
  using: "composite"
  steps:
    - name: Set up dependencies
      shell: bash
      run: |
        # Install EPEL repository for additional packages
        dnf install -y epel-release
        dnf config-manager --set-enabled crb -y

        # EPEL metalink mirrors often 404 a repodata checksum while mirrors
        # catch up. Drop the cached metadata and retry the transaction.
        dnf_with_retry() {
          local attempt
          for attempt in 1 2 3 4 5; do
            if "$@"; then
              return 0
            fi
            echo "dnf failed (attempt ${attempt}): $*" >&2
            dnf clean all
            sleep $((attempt * 5))
          done
          echo "dnf failed after retries: $*" >&2
          return 1
        }

        dnf_with_retry dnf update -y

        # Install build dependencies.
        # Do not install the curl package: CentOS Stream ships curl-minimal,
        # and the two packages conflict. curl-minimal already provides /usr/bin/curl,
        # which is enough to download the OpenSSL 1.1.1w source. perl and make are
        # required to build that OpenSSL.
        dnf_with_retry dnf groupinstall -y "Development Tools"
        dnf_with_retry dnf install -y cmake gcc gcc-c++ make perl glib2-devel libsecret-devel krb5-devel unixODBC unixODBC-devel git which docker
        if ! command -v curl >/dev/null 2>&1; then
          dnf install -y --allowerasing curl
        fi

    - name: Start S2MS cluster
      shell: bash
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python -m pip install singlestoredb
        python ./.github/scripts/setup_s2ms_cluster.py start odbc_test
    - name: Build project
      shell: bash
      run: ./.github/scripts/build-linux-in-docker.sh
    - name: Run tests
      shell: bash
      if: env.NEED_RUN_TESTS != 'false'
      run: ./.github/scripts/run-tests-linux.sh
    # - name: Run browser auth tests  TODO: PLAT-7389 enable these tests
    #   run: ./test/odbc_browser_auth
    - name: Terminate S2MS cluster
      shell: bash
      if: always()
      run: |
          if [ ! -f .venv/bin/activate ]; then
            echo "No cluster virtualenv; nothing to terminate"
            exit 0
          fi
          source .venv/bin/activate
          python -m pip install singlestoredb
          python ./.github/scripts/setup_s2ms_cluster.py terminate || true
