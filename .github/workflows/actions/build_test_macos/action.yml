name: Build & Test (MacOS)
description: "Composite action to build and test the ODBC connector on MacOS"

runs:
  using: "composite"
  steps:
    # Keep brew work minimal. On macos-*-intel Homebrew no longer ships bottles
    # (as of Sep 2026), so any upgrade/install from source dominates the job
    # (cmake alone was ~55m). Runner images already provide cmake/curl/clang.
    - name: Setup Environment on MacOS
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
          set -euo pipefail
          # iODBC is required (WITH_IODBC=ON). Prefer a bottle when available;
          # do not brew update / upgrade — that triggers Intel source builds.
          if ! brew list --versions libiodbc >/dev/null 2>&1; then
            brew install libiodbc
          fi
          brew unlink unixodbc 2>/dev/null || true
          brew link libiodbc --force

          # OpenSSL 3 is required (FindOpenSSL). Install only if missing; never upgrade.
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
    # Start S2MS after brew/build so the expires_at=1h30m window covers tests,
    # not multi-hour brew source builds on Intel.
    - name: Build project
      shell: bash
      run: ./.github/scripts/build-macos.sh
    - name: Start S2MS cluster
      shell: bash
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python -m pip install singlestoredb
        python ./.github/scripts/setup_s2ms_cluster.py start odbc_test
    - name: Run tests
      shell: bash
      if: env.NEED_RUN_TESTS != 'false'
      run: ./.github/scripts/run-tests-macos.sh
    # - name: Run browser auth tests  TODO: PLAT-7389 enable these tests
    #   run: ./test/odbc_browser_auth
    - name: Terminate S2MS cluster
      shell: bash
      if: always()
      run: |
          if [ ! -f .venv/bin/activate ]; then
            echo "No Python venv; cluster was never started"
            exit 0
          fi
          source .venv/bin/activate
          python -m pip install singlestoredb
          python ./.github/scripts/setup_s2ms_cluster.py terminate || true
