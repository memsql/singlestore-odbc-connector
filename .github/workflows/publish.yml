name: Publish installers

on:
  push:
    tags:
      - "v*"

env:
  S2MS_API_KEY: ${{ secrets.S2MS_API_KEY }}
  SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
  MEMSQL_PASSWORD: ${{ secrets.SINGLESTORE_PASSWORD }}
  NEED_RUN_TESTS: 'true'

jobs:
  derive-version:
    name: Derive version from tag
    runs-on: ubuntu-latest
    outputs:
      driver_version: ${{ steps.version.outputs.driver_version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Derive and validate release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # CMake package names use MAJOR.MINOR.PATCH without a pre-release suffix
          PACKAGE_VERSION="${VERSION%%-*}"
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_QUALITY="${VERSION#*-}"
          else
            TAG_QUALITY="ga"
          fi

          CMAKE_MAJOR=$(sed -n 's/^SET(SS_ODBC_VERSION_MAJOR \([0-9][0-9]*\))/\1/p' CMakeLists.txt)
          CMAKE_MINOR=$(sed -n 's/^SET(SS_ODBC_VERSION_MINOR \([0-9][0-9]*\))/\1/p' CMakeLists.txt)
          CMAKE_PATCH=$(sed -n 's/^SET(SS_ODBC_VERSION_PATCH \([0-9][0-9]*\))/\1/p' CMakeLists.txt)
          CMAKE_QUALITY=$(sed -n 's/^SET(SS_ODBC_VERSION_QUALITY "\([^"]*\)")/\1/p' CMakeLists.txt)
          CMAKE_VERSION="${CMAKE_MAJOR}.${CMAKE_MINOR}.${CMAKE_PATCH}"

          if [[ -z "$CMAKE_MAJOR" || -z "$CMAKE_MINOR" || -z "$CMAKE_PATCH" || -z "$CMAKE_QUALITY" ]]; then
            echo "Error: failed to parse version from CMakeLists.txt"
            exit 1
          fi

          if [[ "$PACKAGE_VERSION" != "$CMAKE_VERSION" ]]; then
            echo "Error: tag version '$PACKAGE_VERSION' does not match CMakeLists.txt version '$CMAKE_VERSION'"
            echo "Update CMakeLists.txt (e.g. via ./bump-version.sh) before tagging."
            exit 1
          fi

          if [[ "$TAG_QUALITY" != "$CMAKE_QUALITY" ]]; then
            echo "Error: tag quality '$TAG_QUALITY' does not match CMakeLists.txt quality '$CMAKE_QUALITY'"
            echo "Update CMakeLists.txt (e.g. via ./bump-version.sh) before tagging."
            exit 1
          fi

          echo "driver_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (package version: $PACKAGE_VERSION, quality: $TAG_QUALITY)"
          echo "Validated against CMakeLists.txt: $CMAKE_VERSION ($CMAKE_QUALITY)"

  build-test-ubuntu:
    name: Build & Test (Ubuntu)
    needs: [derive-version]
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo]
        driver_type: [unicode, ansi]
        os_name: [ubuntu]
        include:
          - build_type: RelWithDebInfo
            driver_type: unicode
            test_dsn: ssodbc_test_w
            test_driver: 'SingleStore ODBC Unicode Driver'
            arch: amd64
            image: ubuntu-24.04
          - build_type: RelWithDebInfo
            driver_type: ansi
            test_dsn: ssodbc_test_a
            test_driver: 'SingleStore ODBC ANSI Driver'
            arch: amd64  # TODO: add support for arm64 when arm64 dev image is released
            image: ubuntu-22.04
    runs-on: ${{ matrix.image }}
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      TEST_DSN: ${{ matrix.test_dsn }}
      TEST_DRIVER: ${{ matrix.test_driver }}
      DRIVER_VERSION: ${{ needs.derive-version.outputs.driver_version }}
      MEMSQL_PORT: 5506
      MEMSQL_USER: root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run build and test on Linux (Ubuntu)
        uses: ./.github/workflows/actions/build_test_linux
      - name: Create archive
        run: |
            mkdir singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}
            mkdir singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}/plugins
            cp linuxinstall/README.md singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}
            cp build/libssodbca.so singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}
            cp build/libssodbcw.so singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}
            cp build/libmariadb/auth_gssapi_client.so singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}/plugins
            tar -zcvf singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}
      - name: Upload artifacts
        if: matrix.driver_type == 'unicode'
        uses: actions/upload-artifact@v4
        with:
          name: singlestore-odbc-${{ matrix.os_name }}
          path: singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz
          retention-days: 30

  build-test-centos:
    name: Build & Test (RHEL/CentOS)
    needs: [derive-version]
    runs-on: ubuntu-latest
    container: 
      image: quay.io/centos/centos:stream9
    strategy:
      matrix:
        build_type: [RelWithDebInfo]
        driver_type: [unicode, ansi]
        os_name: [centos]
        include:
          - build_type: RelWithDebInfo
            driver_type: unicode
            test_dsn: ssodbc_test_w
            test_driver: 'SingleStore ODBC Unicode Driver'
          - build_type: RelWithDebInfo
            driver_type: ansi
            test_dsn: ssodbc_test_a
            test_driver: 'SingleStore ODBC ANSI Driver'
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      TEST_DSN: ${{ matrix.test_dsn }}
      TEST_DRIVER: ${{ matrix.test_driver }}
      DRIVER_TYPE: ${{ matrix.driver_type }}
      DRIVER_VERSION: ${{ needs.derive-version.outputs.driver_version }}
      MEMSQL_PORT: 3306
      MEMSQL_USER: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run build and test on RHEL/CentOS
        uses: ./.github/workflows/actions/build_test_centos
      - name: Create archive
        run: |
            mkdir singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64
            mkdir singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64/plugins
            cp linuxinstall/README.md singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64
            cp build/libssodbca.so singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64
            cp build/libssodbcw.so singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64
            cp build/libmariadb/auth_gssapi_client.so singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64/plugins
            tar -zcvf singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64.tar.gz singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64
      - name: Upload artifacts
        if: matrix.driver_type == 'unicode'
        uses: actions/upload-artifact@v4
        with:
          name: singlestore-odbc-${{ matrix.os_name }}
          path: singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-${{ matrix.os_name }}-amd64.tar.gz
          retention-days: 30

  build-test-macos:
    name: Build & Test (macOS)
    needs: [derive-version]
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo]
        driver_type: [unicode]
        arch: [x86_64]
        include:
          - build_type: RelWithDebInfo
            driver_type: unicode
            test_dsn: ssodbc_test_w
            test_driver: 'SingleStore ODBC Unicode Driver'
            arch: x86_64
            image_arch: intel
          - build_type: RelWithDebInfo
            driver_type: ansi
            test_dsn: ssodbc_test_a
            test_driver: 'SingleStore ODBC ANSI Driver'
            arch: x86_64
            image_arch: intel

    runs-on: macos-15-${{ matrix.image_arch }}
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      TEST_DSN: ${{ matrix.test_dsn }}
      TEST_DRIVER: ${{ matrix.test_driver }}
      DRIVER_TYPE: ${{ matrix.driver_type }}
      PACKAGE_VERSION: ${{ needs.derive-version.outputs.package_version }}
      MEMSQL_PORT: 3306
      MEMSQL_USER: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run build and test on MacOS
        uses: ./.github/workflows/actions/build_test_macos
      - name: Upload artifacts
        if: matrix.driver_type == 'unicode'
        uses: actions/upload-artifact@v4
        with:
          name: singlestore-odbc-macos
          path: osxinstall/singlestore-connector-odbc-${{ env.PACKAGE_VERSION }}-macos-${{ matrix.arch }}.pkg
          retention-days: 30

  build-test-windows:
    name: Build & Test (Windows)
    needs: [derive-version]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo]
        driver_type: [unicode]
        arch_bits: [64]
        include:
          - build_type: RelWithDebInfo
            driver_type: unicode
            arch_bits: 64
            test_dsn: ssodbc_test_w
            test_driver: 'SingleStore ODBC Unicode Driver'
          - build_type: RelWithDebInfo
            driver_type: ansi
            arch_bits: 32
            test_dsn: ssodbc_test_a
            test_driver: 'SingleStore ODBC ANSI Driver'
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      TEST_DSN: ${{ matrix.test_dsn }}
      TEST_DRIVER: ${{ matrix.test_driver }}
      DRIVER_TYPE: ${{ matrix.driver_type }}
      ARCH_BITS: ${{ matrix.arch_bits }}
      PACKAGE_VERSION: ${{ needs.derive-version.outputs.package_version }}
      MEMSQL_PORT: 3306
      MEMSQL_USER: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run build and test on Windows
        uses: ./.github/workflows/actions/build_test_windows
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singlestore-odbc-windows-${{ matrix.arch_bits }}bit
          path: wininstall\singlestore-connector-odbc-${{ env.PACKAGE_VERSION }}-win${{ matrix.arch_bits }}.msi
          retention-days: 30

  create-prerelease:
    name: Create Pre-release
    runs-on: ubuntu-latest
    needs: [derive-version, build-test-ubuntu, build-test-centos, build-test-macos, build-test-windows]
    permissions:
      contents: write
    env:
      DRIVER_VERSION: ${{ needs.derive-version.outputs.driver_version }}
      PACKAGE_VERSION: ${{ needs.derive-version.outputs.package_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Pre-release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: SingleStore ODBC Connector ${{ github.ref_name }}
          body: |
            ## SingleStore ODBC Connector ${{ github.ref_name }}

            This is a pre-release of the SingleStore ODBC Connector.
            Review the notes and installers, then edit this release to mark it as the latest when ready.

            ### Downloads
            - **Linux (Ubuntu)**: `singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-ubuntu-*.tar.gz`
            - **Linux (CentOS/RHEL)**: `singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-centos-*.tar.gz`
            - **macOS**: `singlestore-connector-odbc-${{ env.PACKAGE_VERSION }}-macos-*.pkg`
            - **Windows**: `singlestore-connector-odbc-${{ env.PACKAGE_VERSION }}-win*.msi`

            ### Installation Instructions
            Please refer to [SingleStore documentation](https://docs.singlestore.com/cloud/developer-resources/connect-with-application-development-tools/connect-with-odbc/the-singlestore-odbc-driver/) for installation instructions.
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/singlestore-odbc-ubuntu/singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-ubuntu-amd64.tar.gz
            artifacts/singlestore-odbc-centos/singlestore-connector-odbc-${{ env.DRIVER_VERSION }}-centos-amd64.tar.gz
            artifacts/singlestore-odbc-macos/singlestore-connector-odbc-${{ env.PACKAGE_VERSION }}-macos-x86_64.pkg
            artifacts/singlestore-odbc-windows-64bit/singlestore-connector-odbc-${{ env.PACKAGE_VERSION }}-win64.msi
            artifacts/singlestore-odbc-windows-32bit/singlestore-connector-odbc-${{ env.PACKAGE_VERSION }}-win32.msi
